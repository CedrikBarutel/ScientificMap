name: Rebuild manual relations

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild ScientificMap
        run: |
          pip install -r requirements.txt
          python3 script.py build-graph
          rm -f .github/workflows/rebuild-manual-relations.yml
      - name: Commit rebuilt outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Regenerate map with Theory of Living Matter relations"
          git push
