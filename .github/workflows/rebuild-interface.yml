name: Apply ScientificMap interface

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build combined interface
        shell: bash
        run: |
          base64 -d .github/update/html_maps.py.xz.b64 | xz -d > pml_pipeline/html_maps.py
          pip install -r requirements.txt
          python3 script.py build-graph
          rm -rf .github/update
          rm -f .github/workflows/rebuild-interface.yml

      - name: Commit generated interface
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add ScientificMap tabs and enhanced map controls"
          git push
