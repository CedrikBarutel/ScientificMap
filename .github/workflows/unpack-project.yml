name: Unpack project upload

on:
  push:
    paths:
      - '.github/workflows/unpack-project.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        shell: bash
        run: |
          cat .github/payload/part* | base64 -d > /tmp/project.tar.xz
          tar -xJf /tmp/project.tar.xz -C .
          rm -rf .github/payload
          rm -f .github/workflows/unpack-project.yml

      - name: Commit extracted project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add ScientificMap project files"
          git push
